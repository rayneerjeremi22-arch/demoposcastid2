<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PosCast - Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  .pay-on { border-color: #dc2626; background: #fff; color: #dc2626; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #dc2626; outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { #detail { transition: max-height .25s ease; } }
</style>
</head>
<body class="bg-slate-200 text-slate-900">
<div class="mx-auto max-w-md min-h-screen bg-slate-50 relative">

  <!-- HEADER -->
  <header class="sticky top-0 z-20 bg-white border-b border-slate-200 px-4 pt-3 pb-3">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-xs text-slate-500" id="tgl"></div>
        <div class="flex items-center gap-1.5 text-[11px] text-slate-500 mt-0.5">
          <span id="dot" class="w-2 h-2 rounded-full bg-amber-400"></span><span id="status">Menghubungkan…</span>
        </div>
      </div>
      <div class="flex gap-2">
      <button id="btnMenu" aria-label="Menu" class="w-11 h-11 rounded-xl bg-red-600 text-white font-extrabold grid place-items-center active:scale-95">☰</button>
      <button id="btnScan" aria-label="Scan barcode" class="w-11 h-11 rounded-xl bg-slate-900 text-white grid place-items-center active:scale-95">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M11 9v6M15 9v6M18 10v4"/></svg>
      </button></div>
    </div>
    <div class="flex items-center gap-2 mt-3">
      <select id="tipe" class="flex-1 h-10 rounded-lg border border-slate-300 bg-white px-3 text-sm font-semibold">
        <option>Dine-in</option><option>Walk-in</option>
      </select>
      <div class="flex rounded-lg border border-slate-300 overflow-hidden text-sm font-semibold">
        <button id="modeMeja" class="px-3 h-10">Meja</button>
        <button id="modeAntri" class="px-3 h-10 border-l border-slate-300">Antrian</button>
      </div>
    </div>
  </header>

  <!-- KERANJANG -->
  <main class="px-4 pt-3 pb-[430px]">
    <div id="cart" class="space-y-3"></div>
    <button id="btnTambah" class="mt-3 w-full h-11 rounded-xl border-2 border-dashed border-slate-300 text-slate-600 font-semibold text-sm active:bg-slate-100">+ Tambah produk</button>
  </main>

  <!-- DOCK PEMBAYARAN -->
  <section class="fixed bottom-0 inset-x-0 mx-auto max-w-md z-30 bg-slate-900 text-white rounded-t-3xl shadow-2xl px-4 pt-2 pb-[max(1rem,env(safe-area-inset-bottom))]">
    <button id="btnRincian" class="w-full flex items-center justify-between py-2 text-xs font-bold tracking-widest text-slate-300">
      <span>RINCIAN</span><svg id="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div id="detail" class="overflow-hidden max-h-0 text-sm text-slate-300">
      <div class="space-y-1 pb-2">
        <div class="flex justify-between"><span>Jumlah item</span><span id="rItem">0</span></div>
        <div class="flex justify-between"><span>Subtotal</span><span id="rSub">Rp0</span></div>
        <div class="flex justify-between"><span>Diskon</span><span id="rDisc">-Rp0</span></div>
      </div>
    </div>
    <div class="flex items-end justify-between border-t border-slate-700 pt-2">
      <span class="text-xs font-bold tracking-widest text-slate-400 pb-2">TOTAL BAYAR</span>
      <span id="total" class="text-4xl font-extrabold tabular-nums">Rp0</span>
    </div>
    <div id="pays" class="grid grid-cols-4 gap-2 mt-3">
      <button data-m="CASH" class="pay h-14 rounded-xl border-2 border-slate-600 bg-slate-800 text-xs font-bold">CASH</button>
      <button data-m="CARD" class="pay h-14 rounded-xl border-2 border-slate-600 bg-slate-800 text-xs font-bold">CARD</button>
      <button data-m="QR PAY" class="pay h-14 rounded-xl border-2 border-slate-600 bg-slate-800 text-xs font-bold">QR PAY</button>
      <button data-m="SPLIT" class="pay h-14 rounded-xl border-2 border-slate-600 bg-slate-800 text-xs font-bold">SPLIT</button>
    </div>
    <button id="btnKasbon" class="mt-2 w-full h-9 rounded-lg border border-slate-600 text-xs font-semibold text-slate-300">Catat sebagai kasbon (bayar nanti)</button>
    <button id="btnBayar" class="mt-2 w-full h-14 rounded-2xl bg-red-600 active:bg-red-700 disabled:opacity-50 text-white text-base font-extrabold tracking-wide">BAYAR SEKARANG</button>
  </section>

  <div id="dash" class="hidden fixed inset-0 z-40 bg-slate-50 overflow-y-auto"><div id="dashBody" class="mx-auto max-w-md"></div></div>
  <div id="login" class="fixed inset-0 z-[70] bg-slate-900 text-white flex items-center justify-center px-6">
    <div class="w-full max-w-xs">
      <h1 class="text-3xl font-extrabold text-center">PosCast</h1>
      <p class="text-center text-slate-400 text-sm mt-1">Masukkan PIN untuk masuk</p>
      <div id="pinDots" class="flex justify-center gap-3 my-6"></div>
      <div id="keypad" class="grid grid-cols-3 gap-3"></div>
      <p id="pinErr" class="text-center text-red-400 text-sm mt-4 min-h-[1.25rem]"></p>
    </div>
  </div>
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end justify-center"></div>
  <div id="toast" class="hidden fixed top-4 inset-x-0 z-[60] mx-auto w-fit max-w-[90%] rounded-xl px-4 py-2 text-sm font-semibold text-white shadow-lg"></div>
</div>

<script>
/* ============ KONFIGURASI ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwAnuAFTX4fQ-CfLBF8HNdxMnrK2BmbWTquD_hym9yFkRpji_TSIuowJYhAQIk_HAzo/exec';
const SES = { token: sessionStorage.getItem('pc_t') || '', user: JSON.parse(sessionStorage.getItem('pc_u') || 'null') };

/* ============ STATE ============ */
const S = { produk: [], cart: [], metode: 'CASH', mode: 'Meja', nomor: '', busy: false, shift: null, lock: false };

/* ============ UTIL ============ */
const $ = id => document.getElementById(id);
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg, ok = true) {
  const t = $('toast');
  t.textContent = msg; t.className = 'fixed top-4 inset-x-0 z-[60] mx-auto w-fit max-w-[90%] rounded-xl px-4 py-2 text-sm font-semibold text-white shadow-lg ' + (ok ? 'bg-emerald-600' : 'bg-red-600');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2800);
}
function setStatus(ok, text) {
  $('dot').className = 'w-2 h-2 rounded-full ' + (ok ? 'bg-emerald-500' : 'bg-red-500');
  $('status').textContent = text;
}

/* ============ API ============ */
function guard(r) {
  if (!r.ok && /Sesi/.test(r.error || '')) {
    sessionStorage.clear(); toast('Sesi berakhir, silakan masuk lagi', false); setTimeout(() => location.reload(), 1200);
  }
  return r;
}
async function apiGet(params) {
  const r = await fetch(API_URL + '?' + new URLSearchParams({ ...params, t: SES.token }));
  return guard(await r.json());
}
async function apiPost(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, t: SES.token }) });
  return guard(await r.json());
}
async function loadProduk() {
  try {
    const res = await apiGet({ action: 'list', sheet: 'Produk' });
    if (!res.ok) throw new Error(res.error || 'Respons tidak valid');
    S.produk = res.data;
    setStatus(true, 'Terhubung · ' + S.produk.length + ' produk');
  } catch (e) {
    setStatus(false, 'Gagal terhubung. Periksa API_URL & deployment');
    toast('Gagal memuat produk: ' + e.message, false);
  }
}

/* ============ MODAL ============ */
function openModal(html) { const m = $('modal'); m.innerHTML = '<div class="w-full max-w-md bg-white rounded-t-3xl p-4 max-h-[85vh] overflow-y-auto">' + html + '</div>'; m.classList.remove('hidden'); }
function closeModal() { S.lock = false; $('modal').classList.add('hidden'); $('modal').innerHTML = ''; }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && !S.lock) closeModal(); });

function askInput(title, placeholder, initial = '', hint = '') {
  return new Promise(resolve => {
    openModal(`<h3 class="font-bold mb-2">${esc(title)}</h3>
      <input id="askIn" class="w-full h-12 rounded-xl border border-slate-300 px-3" placeholder="${esc(placeholder)}" value="${esc(initial)}">
      <p class="text-xs text-slate-500 mt-1">${esc(hint)}</p>
      <div class="flex gap-2 mt-3"><button id="askNo" class="flex-1 h-11 rounded-xl bg-slate-100 font-semibold">Batal</button><button id="askOk" class="flex-1 h-11 rounded-xl bg-slate-900 text-white font-semibold">Simpan</button></div>`);
    const inp = $('askIn'); inp.focus(); inp.select();
    const done = v => { closeModal(); resolve(v); };
    $('askOk').onclick = () => done(inp.value.trim());
    $('askNo').onclick = () => done(null);
    inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value.trim()); };
  });
}

/* ============ KERANJANG ============ */
function discOf(it) {
  const raw = String(it.disc || '').trim(); if (!raw) return 0;
  const gross = it.harga * it.qty;
  const v = raw.endsWith('%') ? gross * (parseFloat(raw) || 0) / 100 : parseFloat(raw.replace(/[^\d.]/g, '')) || 0;
  return Math.min(Math.max(v, 0), gross);
}
function addToCart(p) {
  if (Number(p.Stok) <= 0) return toast(p['Nama Produk'] + ' stok habis', false);
  const ex = S.cart.find(c => c.sku === String(p.SKU));
  if (ex) { if (ex.qty + 1 > p.Stok) return toast('Stok tidak cukup (sisa ' + p.Stok + ')', false); ex.qty++; }
  else S.cart.push({ sku: String(p.SKU), nama: p['Nama Produk'] + (p.Varian ? ' · ' + p.Varian : ''), harga: Number(p['Harga Jual']), qty: 1, note: '', disc: '' });
  render();
}
function render() {
  const cart = $('cart');
  if (!S.cart.length) {
    cart.innerHTML = '<div class="text-center text-slate-500 py-16 text-sm">Keranjang kosong.<br>Scan barcode atau ketuk <b>Tambah produk</b>.</div>';
  } else {
    cart.innerHTML = S.cart.map((it, i) => {
      const d = discOf(it);
      return `<article class="bg-white rounded-2xl border border-slate-200 p-3">
        <div class="flex justify-between gap-2">
          <div class="min-w-0"><h4 class="font-bold text-sm leading-snug">${esc(it.nama)}</h4>
            <div class="text-sm text-slate-600">${rp(it.harga)}${d ? ` <span class="text-red-600 font-semibold">−${rp(d)}</span>` : ''}</div></div>
          <div class="font-bold tabular-nums">${rp(it.harga * it.qty - d)}</div>
        </div>
        ${it.note ? `<div class="mt-1 text-xs text-amber-700 bg-amber-50 rounded px-2 py-1">Catatan: ${esc(it.note)}</div>` : ''}
        <div class="flex items-center justify-between mt-2">
          <div class="flex items-center gap-3 text-sm font-semibold">
            <button data-a="note" data-i="${i}" class="text-slate-600 underline underline-offset-2">${it.note ? 'Ubah Catatan' : 'Tambah Catatan'}</button>
            <button data-a="disc" data-i="${i}" class="text-red-600 underline underline-offset-2">${it.disc ? 'Ubah Diskon' : 'Terapkan Diskon'}</button>
          </div>
          <div class="flex items-center gap-1">
            <button data-a="dec" data-i="${i}" aria-label="Kurangi" class="w-9 h-9 rounded-lg bg-slate-100 text-lg font-bold">−</button>
            <span class="w-8 text-center font-bold tabular-nums">${it.qty}</span>
            <button data-a="inc" data-i="${i}" aria-label="Tambah" class="w-9 h-9 rounded-lg bg-slate-100 text-lg font-bold">+</button>
            <button data-a="del" data-i="${i}" aria-label="Hapus" class="w-9 h-9 rounded-lg text-red-600 grid place-items-center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button>
          </div>
        </div></article>`;
    }).join('');
  }
  const sub = S.cart.reduce((a, c) => a + c.harga * c.qty, 0);
  const disc = S.cart.reduce((a, c) => a + discOf(c), 0);
  $('rItem').textContent = S.cart.reduce((a, c) => a + c.qty, 0);
  $('rSub').textContent = rp(sub); $('rDisc').textContent = '−' + rp(disc);
  $('total').textContent = rp(sub - disc);
}
$('cart').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const i = +b.dataset.i, it = S.cart[i], a = b.dataset.a;
  if (a === 'inc') {
    const p = S.produk.find(x => String(x.SKU) === it.sku);
    if (p && it.qty + 1 > p.Stok) return toast('Stok tidak cukup (sisa ' + p.Stok + ')', false);
    it.qty++;
  }
  else if (a === 'dec') { it.qty--; if (it.qty <= 0) S.cart.splice(i, 1); }
  else if (a === 'del') S.cart.splice(i, 1);
  else if (a === 'note') { const v = await askInput('Catatan untuk ' + it.nama, 'mis. less sugar', it.note); if (v !== null) it.note = v; }
  else if (a === 'disc') { const v = await askInput('Diskon untuk ' + it.nama, '5000 atau 10%', it.disc, 'Isi nominal rupiah, atau persen dengan tanda %. Kosongkan untuk menghapus.'); if (v !== null) it.disc = v; }
  render();
});

/* ============ PICKER PRODUK / SCANNER ============ */
function openPicker() {
  openModal(`<input id="q" class="w-full h-12 rounded-xl border border-slate-300 px-3" placeholder="Scan barcode / ketik nama atau SKU" autocomplete="off">
    <div id="plist" class="mt-3 divide-y divide-slate-100"></div>`);
  const q = $('q'), list = $('plist');
  const draw = () => {
    const k = q.value.toLowerCase();
    const hit = S.produk.filter(p => !k || [p.SKU, p.Barcode, p['Nama Produk'], p.Varian].join(' ').toLowerCase().includes(k));
    list.innerHTML = hit.length ? hit.map(p => `<button data-sku="${esc(p.SKU)}" class="w-full flex justify-between items-center py-3 text-left active:bg-slate-50">
        <span><b class="text-sm">${esc(p['Nama Produk'])}</b> <span class="text-xs text-slate-500">${esc(p.Varian)}</span><br><span class="text-xs text-slate-500">Stok ${p.Stok} ${esc(p.Satuan)}</span></span>
        <span class="font-bold text-sm">${rp(p['Harga Jual'])}</span></button>`).join('') : '<p class="text-center text-sm text-slate-500 py-6">Produk tidak ditemukan.</p>';
  };
  q.oninput = draw; draw(); q.focus();
  q.onkeydown = e => { // scanner fisik mengirim kode + Enter
    if (e.key !== 'Enter') return;
    const k = q.value.trim(); if (!k) return;
    const p = S.produk.find(x => String(x.Barcode) === k || String(x.SKU).toLowerCase() === k.toLowerCase());
    if (p) { addToCart(p); q.value = ''; draw(); toast('+ ' + p['Nama Produk']); } else toast('Kode tidak dikenal: ' + k, false);
  };
  list.onclick = e => { const b = e.target.closest('button[data-sku]'); if (!b) return; addToCart(S.produk.find(x => String(x.SKU) === b.dataset.sku)); closeModal(); };
}
$('btnScan').onclick = openPicker;
$('btnTambah').onclick = openPicker;

/* ============ TIPE PESANAN, RINCIAN, METODE ============ */
function renderMode() {
  const on = 'bg-slate-900 text-white';
  $('modeMeja').className = 'px-3 h-10 ' + (S.mode === 'Meja' ? on : 'bg-white');
  $('modeAntri').className = 'px-3 h-10 border-l border-slate-300 ' + (S.mode === 'Antrian' ? on : 'bg-white');
  $('modeMeja').textContent = S.mode === 'Meja' && S.nomor ? 'Meja ' + S.nomor : 'Meja';
  $('modeAntri').textContent = S.mode === 'Antrian' && S.nomor ? 'Antrian ' + S.nomor : 'Antrian';
}
async function pilihMode(mode) {
  const v = await askInput('Nomor ' + mode.toLowerCase(), mode === 'Meja' ? 'mis. 5' : 'mis. A12', S.mode === mode ? S.nomor : '');
  if (v === null) return;
  S.mode = mode; S.nomor = v; renderMode();
}
$('modeMeja').onclick = () => pilihMode('Meja');
$('modeAntri').onclick = () => pilihMode('Antrian');

let rOpen = false;
$('btnRincian').onclick = () => {
  rOpen = !rOpen;
  $('detail').style.maxHeight = rOpen ? '120px' : '0';
  $('chev').style.transform = rOpen ? 'rotate(180deg)' : '';
};
function renderPay() {
  document.querySelectorAll('.pay').forEach(b => b.classList.toggle('pay-on', b.dataset.m === S.metode));
  const k = S.metode === 'KASBON';
  $('btnKasbon').className = 'mt-2 w-full h-9 rounded-lg border text-xs font-semibold ' + (k ? 'border-red-500 bg-white text-red-600' : 'border-slate-600 text-slate-300');
  $('btnKasbon').textContent = k ? 'Kasbon aktif · ketuk untuk batalkan' : 'Catat sebagai kasbon (bayar nanti)';
}
$('pays').onclick = e => { const b = e.target.closest('.pay'); if (b) { S.metode = b.dataset.m; renderPay(); } };

/* ============ BAYAR ============ */
$('btnBayar').onclick = async () => {
  if (S.busy) return;
  if (!S.cart.length) return toast('Keranjang masih kosong', false);
  if (!S.shift) { toast('Mulai shift terlebih dahulu', false); return shiftModal(); }
  let pelanggan = null;
  if (S.metode === 'KASBON') { pelanggan = await kasbonModal(); if (!pelanggan) return; }
  S.busy = true; $('btnBayar').disabled = true; $('btnBayar').textContent = 'MEMPROSES…';
  try {
    const res = await apiPost({
      action: 'createTransaction', metode: S.metode, diskon: 0, pelanggan,
      items: S.cart.map(c => ({ sku: c.sku, qty: c.qty, diskonItem: discOf(c), catatan: c.note }))
    });
    if (!res.ok) throw new Error(res.error);
    toast('Berhasil · ' + res.idTransaksi + ' · ' + rp(res.total));
    S.cart = []; S.nomor = ''; S.metode = 'CASH'; renderPay(); renderMode(); render();
    await loadProduk(); // segarkan stok
  } catch (e) { toast('Gagal: ' + e.message, false); }
  finally { S.busy = false; $('btnBayar').disabled = false; $('btnBayar').textContent = 'BAYAR SEKARANG'; }
};

/* ============ BATCH 3: PIN, SHIFT, KASBON, DASHBOARD ============ */
let pin = '';
function drawPin() {
  $('pinDots').innerHTML = Array.from({ length: 6 }, (_, i) => `<span class="w-3.5 h-3.5 rounded-full ${i < pin.length ? 'bg-white' : 'bg-slate-600'}"></span>`).join('');
}
$('keypad').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'OK']
  .map(k => `<button data-k="${k}" class="h-16 rounded-2xl ${k === 'OK' ? 'bg-red-600' : 'bg-slate-800'} text-xl font-bold active:scale-95">${k}</button>`).join('');
function pressKey(k) {
  $('pinErr').textContent = '';
  if (k === '⌫') pin = pin.slice(0, -1);
  else if (k === 'OK') return doLogin();
  else if (pin.length < 6) pin += k;
  drawPin();
  if (pin.length === 6) doLogin();
}
$('keypad').onclick = e => { const b = e.target.closest('button[data-k]'); if (b) pressKey(b.dataset.k); };
document.addEventListener('keydown', e => {
  if ($('login').classList.contains('hidden')) return;
  if (/^\d$/.test(e.key)) pressKey(e.key); else if (e.key === 'Backspace') pressKey('⌫'); else if (e.key === 'Enter') pressKey('OK');
});
async function doLogin() {
  if (pin.length < 4 || S.busy) return;
  S.busy = true;
  try {
    const r = await apiPost({ action: 'login', pin });
    if (!r.ok) throw new Error(r.error);
    SES.token = r.token; SES.user = r.user;
    sessionStorage.setItem('pc_t', r.token); sessionStorage.setItem('pc_u', JSON.stringify(r.user));
    pin = ''; drawPin(); startApp();
  } catch (e) { $('pinErr').textContent = e.message; pin = ''; drawPin(); }
  finally { S.busy = false; }
}
async function startApp() {
  $('login').classList.add('hidden');
  $('btnMenu').textContent = SES.user.nama.charAt(0).toUpperCase();
  await loadProduk();
  const r = await apiPost({ action: 'shiftCurrent' });
  S.shift = r.shift || null;
  if (!S.shift) shiftModal();
}
async function logout() {
  try { await apiPost({ action: 'logout' }); } catch (e) {}
  sessionStorage.clear(); location.reload();
}

/* --- Shift --- */
function shiftModal() {
  S.lock = true;
  openModal(`<h3 class="font-bold text-lg">Mulai shift</h3>
    <p class="text-sm text-slate-500 mb-3">Masukkan modal awal uang di laci kas.</p>
    <input id="sMod" inputmode="numeric" class="w-full h-12 rounded-xl border border-slate-300 px-3" placeholder="mis. 200000">
    <button id="sGo" class="mt-3 w-full h-12 rounded-xl bg-red-600 text-white font-bold">Mulai shift</button>
    ${SES.user.role === 'owner' ? '<button id="sSkip" class="mt-2 w-full h-11 rounded-xl bg-slate-100 font-semibold">Lihat dashboard saja</button>' : ''}`);
  $('sMod').focus();
  $('sGo').onclick = async () => {
    if ($('sMod').value.trim() === '') return toast('Isi modal awal (boleh 0)', false);
    const modal = Number($('sMod').value.replace(/[^\d]/g, ''));
    const r = await apiPost({ action: 'shiftStart', modal });
    if (!r.ok) return toast(r.error, false);
    S.shift = r.shift; closeModal();
    toast(r.resumed ? 'Melanjutkan shift yang masih terbuka' : 'Shift dimulai · modal ' + rp(modal));
  };
  if ($('sSkip')) $('sSkip').onclick = () => { closeModal(); openDash(); };
}
async function kas(tipe) {
  if (!S.shift) return toast('Mulai shift terlebih dahulu', false);
  const v = await askInput(tipe === 'in' ? 'Kas masuk (Paid In)' : 'Kas keluar (Paid Out)', 'Nominal rupiah');
  const n = Number((v || '').replace(/[^\d]/g, ''));
  if (!n) return;
  const r = await apiPost({ action: 'paidInOut', tipe, nominal: n });
  if (!r.ok) return toast(r.error, false);
  S.shift = r.shift; toast('Tercatat ' + rp(n));
}
async function tutupShift() {
  if (!S.shift) return toast('Tidak ada shift aktif', false);
  const v = await askInput('Tutup shift', 'Total uang fisik di laci', '', 'Hitung semua uang di laci lalu isi totalnya. Sistem membandingkan dengan catatan transaksi.');
  if (!v) return;
  const r = await apiPost({ action: 'shiftEnd', kasFisik: Number(v.replace(/[^\d]/g, '')) });
  if (!r.ok) return toast(r.error, false);
  const w = r.selisih === 0 ? 'text-emerald-600' : r.selisih < 0 ? 'text-red-600' : 'text-amber-600';
  const row = (a, b, c = '') => `<div class="flex justify-between py-1 text-sm"><span class="text-slate-600">${a}</span><b class="tabular-nums ${c}">${b}</b></div>`;
  S.lock = true;
  openModal(`<h3 class="font-bold text-lg mb-2">Shift ditutup</h3>
    ${row('Modal awal', rp(r.modal))}${row('Penjualan tunai', rp(r.tunai))}${row('Kas masuk', rp(r.paidIn))}${row('Kas keluar', '−' + rp(r.paidOut))}
    <div class="border-t my-2"></div>
    ${row('Seharusnya di laci', rp(r.expected))}${row('Uang fisik', rp(r.fisik))}
    ${row('Selisih', (r.selisih > 0 ? '+' : r.selisih < 0 ? '−' : '') + rp(Math.abs(r.selisih)) + (r.selisih === 0 ? ' · cocok' : r.selisih < 0 ? ' · kurang' : ' · lebih'), w)}
    <button id="selesai" class="mt-3 w-full h-12 rounded-xl bg-slate-900 text-white font-bold">Selesai & keluar</button>`);
  $('selesai').onclick = logout;
}

/* --- Menu --- */
$('btnMenu').onclick = () => {
  const owner = SES.user.role === 'owner';
  const items = [...(S.shift ? [] : [['mulai', 'Mulai shift']]), ['pin', 'Kas masuk (Paid In)'], ['pout', 'Kas keluar (Paid Out)'], ['tutup', 'Tutup shift'], ...(owner ? [['dash', 'Dashboard laba operasional']] : []), ['logout', 'Keluar']];
  openModal(`<div class="text-sm text-slate-500 mb-3">${esc(SES.user.nama)} · ${esc(SES.user.role)}${S.shift ? ' · shift ' + esc(S.shift['ID Shift']) : ' · belum ada shift'}</div>
    <div class="space-y-2">${items.map(([k, t]) => `<button data-mn="${k}" class="w-full h-12 rounded-xl bg-slate-100 font-semibold text-left px-4 active:bg-slate-200">${t}</button>`).join('')}</div>`);
  const act = { mulai: shiftModal, pin: () => kas('in'), pout: () => kas('out'), tutup: tutupShift, dash: openDash, logout };
  $('modal').querySelectorAll('[data-mn]').forEach(b => b.onclick = () => { closeModal(); act[b.dataset.mn](); });
};

/* --- Kasbon --- */
$('btnKasbon').onclick = () => { S.metode = S.metode === 'KASBON' ? 'CASH' : 'KASBON'; renderPay(); };
function kasbonModal() {
  return new Promise(res => {
    const tempo = new Date(Date.now() + 7 * 864e5).toLocaleDateString('sv-SE', { timeZone: 'Asia/Jakarta' });
    openModal(`<h3 class="font-bold mb-3">Kasbon pelanggan</h3>
      <label class="text-xs text-slate-500">Nama pelanggan</label>
      <input id="kbNama" class="w-full h-12 rounded-xl border border-slate-300 px-3 mb-3" placeholder="mis. Bu Siti">
      <label class="text-xs text-slate-500">Tanggal jatuh tempo</label>
      <input id="kbTempo" type="date" value="${tempo}" class="w-full h-12 rounded-xl border border-slate-300 px-3">
      <div class="flex gap-2 mt-4"><button id="kbNo" class="flex-1 h-11 rounded-xl bg-slate-100 font-semibold">Batal</button><button id="kbOk" class="flex-1 h-11 rounded-xl bg-red-600 text-white font-semibold">Simpan kasbon</button></div>`);
    $('kbNama').focus();
    $('kbNo').onclick = () => { closeModal(); res(null); };
    $('kbOk').onclick = () => {
      const nama = $('kbNama').value.trim();
      if (!nama) return toast('Nama pelanggan wajib diisi', false);
      const jatuhTempo = $('kbTempo').value; closeModal(); res({ nama, jatuhTempo });
    };
  });
}

/* --- Dashboard laba (owner) --- */
function openDash() {
  $('dash').classList.remove('hidden');
  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Jakarta' });
  $('dashBody').innerHTML = `<div class="sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between"><button id="dBack" class="font-semibold text-sm">← Kembali</button><b>Laba operasional</b><span class="w-14"></span></div>
    <div class="p-4 space-y-3">
      <div class="flex gap-2"><input id="dFrom" type="date" value="${today}" class="flex-1 min-w-0 h-10 rounded-lg border border-slate-300 px-2 text-sm"><input id="dTo" type="date" value="${today}" class="flex-1 min-w-0 h-10 rounded-lg border border-slate-300 px-2 text-sm"><button id="dGo" class="px-4 h-10 rounded-lg bg-slate-900 text-white text-sm font-semibold">Tampil</button></div>
      <div id="dRes" class="space-y-3"></div></div>`;
  $('dBack').onclick = () => $('dash').classList.add('hidden');
  $('dGo').onclick = loadDash; loadDash();
}
async function loadDash() {
  $('dRes').innerHTML = '<p class="text-center text-sm text-slate-500 py-8">Memuat…</p>';
  try {
    const r = await apiPost({ action: 'laporan', dari: $('dFrom').value, sampai: $('dTo').value });
    if (!r.ok) throw new Error(r.error);
    const stat = (l, v, c = '') => `<div class="bg-white rounded-2xl border border-slate-200 p-3"><div class="text-xs text-slate-500">${l}</div><div class="font-extrabold text-lg tabular-nums ${c}">${v}</div></div>`;
    const line = (a, b) => `<div class="flex justify-between py-2 text-sm"><span>${esc(a)}</span><b class="tabular-nums">${b}</b></div>`;
    $('dRes').innerHTML = `<div class="rounded-3xl bg-slate-900 text-white p-4"><div class="text-xs text-slate-400">Laba operasional</div>
        <div class="text-4xl font-extrabold tabular-nums mt-1 ${r.laba < 0 ? 'text-red-400' : ''}">${rp(r.laba)}</div>
        <div class="text-xs text-slate-400 mt-1">Margin ${r.margin.toFixed(1)}% · ${r.jumlahTransaksi} transaksi</div></div>
      <div class="grid grid-cols-2 gap-3">${stat('Total penjualan', rp(r.penjualan))}${stat('HPP terjual', rp(r.hpp))}${stat('Item terjual', r.itemTerjual)}${stat('Piutang kasbon', rp(r.piutang), 'text-amber-600')}</div>
      <div class="bg-white rounded-2xl border border-slate-200 p-3"><h4 class="font-bold text-sm mb-1">Per metode bayar</h4><div class="divide-y divide-slate-100">${r.perMetode.map(m => line(m.metode + ' (' + m.jumlah + ')', rp(m.total))).join('') || '<p class="text-sm text-slate-500 py-2">Belum ada transaksi.</p>'}</div></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-3"><h4 class="font-bold text-sm mb-1">Produk terlaris</h4><div class="divide-y divide-slate-100">${r.topProduk.map(p => line(p.nama + ' ×' + p.qty, 'laba ' + rp(p.laba))).join('') || '<p class="text-sm text-slate-500 py-2">Belum ada data.</p>'}</div></div>`;
  } catch (e) { $('dRes').innerHTML = '<p class="text-center text-sm text-red-600 py-8">Gagal memuat: ' + esc(e.message) + '</p>'; }
}

/* ============ INIT ============ */
$('tgl').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
renderMode(); renderPay(); render(); drawPin();
if (SES.token && SES.user) startApp();
</script>
</body>
</html>
